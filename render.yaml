services:
  - type: web
    name: geospatial-measurement-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      - key: MAX_UPLOAD_SIZE_BYTES
        value: 26214400
      - key: MAX_DECOMPRESSED_SIZE_BYTES
        value: 104857600
      - key: MAX_ZIP_COMPRESSION_RATIO
        value: 100.0
      - key: CORS_ORIGINS
        value: "*"
