name: CI / Automated Regression Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (GDAL / GEOS / PROJ support)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt httpx pytest

      - name: Start FastAPI Backend in background
        run: |
          nohup uvicorn main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          sleep 5
          curl -f http://127.0.0.1:8000/api/health/ || cat uvicorn.log

      - name: Run Full Master Regression Suite (136 Scenarios)
        run: |
          python tests/run_all_tests.py
